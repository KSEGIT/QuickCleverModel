<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0d1b2a"/>
      <stop offset="1" stop-color="#0a1f1a"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee787"/>
      <stop offset="0.6" stop-color="#56d4dd"/>
      <stop offset="1" stop-color="#539bf5"/>
    </linearGradient>
    <linearGradient id="branch" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#56d4dd"/>
    </linearGradient>
    <radialGradient id="nodeGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ee787" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#7ee787" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7ee787" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#56d4dd" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#56d4dd" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#56d4dd" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <!-- bonsai / neural-graph tree -->
  <g stroke="url(#branch)" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M 210 330 C 210 300 208 265 210 230"/>
    <path d="M 210 230 C 190 210 165 190 150 170 C 138 155 128 138 122 122"/>
    <path d="M 210 230 C 232 208 255 190 270 170 C 282 152 292 132 298 112"/>
    <path d="M 210 230 C 212 205 210 178 208 152 C 206 135 200 118 192 102"/>
    <path d="M 122 122 C 110 112 98 100 92 90"/>
    <path d="M 122 122 C 130 108 136 94 140 82"/>
    <path d="M 298 112 C 310 102 322 92 330 82"/>
    <path d="M 298 112 C 292 98 286 84 282 72"/>
    <path d="M 192 102 C 182 88 172 74 164 62"/>
    <path d="M 192 102 C 202 88 212 72 218 58"/>
  </g>

  <!-- node glows -->
  <g>
    <circle cx="92" cy="90" r="26" fill="url(#nodeGlow)"/>
    <circle cx="140" cy="82" r="26" fill="url(#nodeGlowCyan)"/>
    <circle cx="330" cy="82" r="26" fill="url(#nodeGlow)"/>
    <circle cx="282" cy="72" r="26" fill="url(#nodeGlowCyan)"/>
    <circle cx="164" cy="62" r="26" fill="url(#nodeGlowCyan)"/>
    <circle cx="218" cy="58" r="30" fill="url(#nodeGlow)"/>
    <circle cx="210" cy="230" r="20" fill="url(#nodeGlow)"/>
  </g>
  <!-- node cores -->
  <g fill="#eaffea" stroke="none">
    <circle cx="92" cy="90" r="5"/>
    <circle cx="140" cy="82" r="5"/>
    <circle cx="330" cy="82" r="5"/>
    <circle cx="282" cy="72" r="5"/>
    <circle cx="164" cy="62" r="5"/>
    <circle cx="218" cy="58" r="6.5"/>
    <circle cx="122" cy="122" r="4"/>
    <circle cx="298" cy="112" r="4"/>
    <circle cx="192" cy="102" r="4"/>
    <circle cx="210" cy="230" r="4.5"/>
  </g>

  <!-- title block -->
  <g font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="430" y="150" font-size="58" font-weight="700" fill="url(#title)" letter-spacing="0.5">QuickCleverModel</text>
    <text x="432" y="196" font-size="23" fill="#9fb3c8">Bonsai 27B — 1-bit &amp; ternary thinking models, served locally</text>

    <!-- chips -->
    <g font-size="17" font-weight="600">
      <rect x="432" y="228" width="150" height="36" rx="18" fill="#7ee787" fill-opacity="0.10" stroke="#7ee787" stroke-opacity="0.45"/>
      <text x="507" y="251" fill="#7ee787" text-anchor="middle">Apple Metal</text>

      <rect x="596" y="228" width="190" height="36" rx="18" fill="#56d4dd" fill-opacity="0.10" stroke="#56d4dd" stroke-opacity="0.45"/>
      <text x="691" y="251" fill="#56d4dd" text-anchor="middle">CUDA · RTX 3070</text>

      <rect x="800" y="228" width="180" height="36" rx="18" fill="#539bf5" fill-opacity="0.10" stroke="#539bf5" stroke-opacity="0.45"/>
      <text x="890" y="251" fill="#539bf5" text-anchor="middle">llama.cpp router</text>
    </g>

    <text x="432" y="308" font-size="16" fill="#5c6f84">fast · surprisingly reliable · your GPU, your weights</text>
  </g>
</svg>
