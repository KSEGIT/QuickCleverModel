# Full Linux + NVIDIA stack: CUDA llama-server + Open WebUI, both in containers.
#
# Host needs: NVIDIA driver >= 525 (for CUDA 12.4), Docker, and
# nvidia-container-toolkit. Fetch the weights on the host first with
# ../fetch-models.sh — they are mounted read from ../models, not baked in.
#
# Run from the repo root with --env-file so compose variable interpolation
# (OPENAI_API_KEY below) sees the key: env_file: injects into the container
# but is NOT read by interpolation, and the project-dir .env lookup finds
# docker/.env, not the root one:
#   docker compose --env-file .env -f docker/compose.linux.yaml up --build -d
name: bonsai
services:
  llama:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: bonsai-llama:cuda
    # deploy.devices is the long-supported GPU form; `gpus: all` shorthand
    # needs Docker Compose >= v2.30, newer than Ubuntu's distro package.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      # Loopback by default. The API key is enforced, but there is no reason
      # to publish at all — webui reaches llama over the compose network.
      # Remote access: set LLAMA_BIND to the machine's Tailscale/LAN IP in
      # .env, or prefer an ssh -L tunnel and leave this alone.
      - "${LLAMA_BIND:-127.0.0.1}:8080:8080"
      # Second listener for a second interface, e.g. a second tailscaled
      # (two tailnets, two 100.x IPs): set LLAMA_BIND2 to that IP in .env.
      # 127.0.0.2 keeps the default loopback-only without colliding with
      # the first mapping. Note Docker fails to bind if the IP does not
      # exist yet -- start tailscaled before compose at boot.
      - "${LLAMA_BIND2:-127.0.0.2}:8080:8080"
    volumes:
      - ../models:/app/models:ro
    env_file: ../.env
    environment:
      # 8 GB VRAM (RTX 3070 Ti): 8192 ctx leaves room for KV cache next to the
      # weights. On a box with plenty of RAM, set in .env instead:
      #   BONSAI_CTX=32768
      #   BONSAI_NO_KV_OFFLOAD=true   (KV cache lives in system RAM, weights on GPU)
      # BONSAI_NO_KV_OFFLOAD reaches the container via env_file above.
      # More .env knobs, all via env_file:
      #   BONSAI_CTK=q8_0 BONSAI_CTV=q8_0   KV type; with host-side KV q8_0 can
      #     beat q4_0 -- the CPU KV fast path is gated on non-q4 types.
      #   BONSAI_UBATCH=256   fixes cudaMalloc OOM on 8 GB cards, ~25% slower prefill
      #   BONSAI_REASONING_BUDGET=4096   caps thinking tokens; -1 = unlimited
      #   BONSAI_SPEC=ngram-mod   speculative decoding; better than the
      #   ngram-simple default on repetitive code/tool-call output
      BONSAI_CTX: ${BONSAI_CTX:-8192}
    restart: unless-stopped

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: bonsai-webui
    ports:
      # WEBUI_AUTH is false below — loopback by default, or the whole LAN gets
      # an unauthenticated chat UI. Remote access: set WEBUI_BIND to the
      # machine's Tailscale IP in .env (tailnet-only exposure), or prefer an
      # ssh -L tunnel and leave this alone.
      - "${WEBUI_BIND:-127.0.0.1}:9090:8080"
      # Second listener, same idea as LLAMA_BIND2 above. Set WEBUI_BIND2 to
      # the second tailscaled's IP in .env. Flip WEBUI_AUTH to true before
      # exposing this beyond your own machines.
      - "${WEBUI_BIND2:-127.0.0.2}:9090:8080"
    environment:
      # The trailing /v1 matters — llama-server serves the OpenAI-compatible API there.
      OPENAI_API_BASE_URL: "http://llama:8080/v1"
      OPENAI_API_KEY: "${BONSAI_API_KEY:?set BONSAI_API_KEY in ../.env}"
      WEBUI_AUTH: "false"          # single-user local box; flip to true to require login
      ENABLE_OLLAMA_API: "false"   # we are not running Ollama
      # Background generations (title, tags, follow-ups...) decode concurrently
      # with your reply and steal bandwidth on a single-GPU box — same reasoning
      # as start-webui.sh.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
    depends_on:
      - llama
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped

volumes:
  open-webui-data:
